name: Build CapCut Wallet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          unzip -q CapCut_Wallet.zip -d extracted
          echo "Extracted project files:"
          ls -la extracted

      - name: Locate Gradle project
        run: |
          PROJECT_DIR=$(find extracted -name gradlew -type f -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No gradlew file found in ZIP."
            echo "The ZIP may not contain a complete Android project."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CapCut-Wallet-Debug-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
